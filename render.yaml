# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Render Blueprint: the API's hosting setup, written as code.
# Secrets are NOT in this file: `sync: false` means "ask for it in the Render dashboard".
services:
  - type: web
    name: portfolio-api
    runtime: node
    plan: free
    region: oregon
    # Dev dependencies (TypeScript) are needed to build, even though NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build --workspace=api
    # Free instances can't use a pre-deploy command, so migrations run first, then the
    # server starts. `exec` makes Node the main process, so Render's shutdown signal
    # reaches our graceful-shutdown code.
    startCommand: node apps/api/dist/migrate.js && exec node apps/api/dist/server.js
    healthCheckPath: /health
    # Only deploy commits whose GitHub CI checks passed.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false